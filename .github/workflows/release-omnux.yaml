name: omnux-release

on:
  push:
    tags: [ 'omnux-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artefact
        uses: actions/download-artifact@v8
        with:
          name: installer-build
          path: releases/.

      - name: Checksum
        run: |
          cd releases
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "omnux-v*" ] || [ -z "$TAG" ]; then
            TAG="omnux-dev-$(date +%Y%m%d%H%M%S)"
          fi
          cat > release-notes.md <<'NOTES'
          Automated Omnux installer build.

          Install:

              curl -fsSL https://raw.githubusercontent.com/michaelmonetized/asahi-installer/omnux/scripts/bootstrap-omnux.sh | sh

          M1/M2: supported. M3: experimental (software rendering). M4/M5: cannot boot Linux yet.
          NOTES
          gh release create "$TAG" releases/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Omnux installer $TAG" \
            --notes-file release-notes.md
